version: 0.1
cli:
  version: 1.4.0
plugins:
  sources:
    - id: trunk
      ref: v0.0.8
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - prettier@2.8.3
    - markdownlint@0.33.0
    - actionlint@1.6.23
    - gitleaks@8.15.3
    - oxipng@8.0.0
    - git-diff-check
  ignore:
    # The vendored organization code-review skill is installed at a pinned
    # revision, and org-routing.py check compares its resource files byte for
    # byte; formatting them would break the pin.
    - linters: [prettier, markdownlint]
      paths:
        - .github/skills/code-review/**
runtimes:
  enabled:
    - go@1.18.3
    - node@18.12.1
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
