---
name: Org Routing

# ADR-0031: verify generated routing and approved organization skills.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# The reusable workflow owns concurrency; a duplicate caller group can deadlock.
jobs:
  org-routing:
    name: Org Routing
    permissions:
      contents: read
    uses: z-shell/.github/.github/workflows/org-routing.yml@00e7d1bb1f4d9ddfa582b47138c70bd0d01014a8 # main
